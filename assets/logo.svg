<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="decisor-logo-title">
  <title id="decisor-logo-title">decisor</title>
  <defs>
    <linearGradient id="decisor-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#decisor-bg)"/>

  <!-- The state: one input column, deliberately quieter than the answers. -->
  <rect x="28" y="30" width="12" height="68" rx="6" fill="#ffffff" opacity="0.40"/>

  <!-- The answers: one bar per candidate, width is its probability.
       Opacities are kept high enough that the shortest bar still reads
       against the gradient (measured, not guessed). -->
  <rect x="48" y="36" width="54" height="12" rx="6" fill="#ffffff"/>
  <rect x="48" y="58" width="34" height="12" rx="6" fill="#ffffff" opacity="0.85"/>
  <rect x="48" y="80" width="18" height="12" rx="6" fill="#ffffff" opacity="0.62"/>
</svg>
