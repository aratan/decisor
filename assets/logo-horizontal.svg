<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-labelledby="decisor-h-title">
  <title id="decisor-h-title">decisor — decisiones con probabilidad</title>
  <defs>
    <linearGradient id="decisor-h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="560" height="160" rx="28" fill="#0b1220"/>

  <!-- Emblema -->
  <g transform="translate(28 24)">
    <rect width="112" height="112" rx="26" fill="url(#decisor-h-bg)"/>
    <rect x="24" y="26" width="10" height="60" rx="5" fill="#ffffff" opacity="0.40"/>
    <rect x="41" y="31" width="47" height="11" rx="5.5" fill="#ffffff"/>
    <rect x="41" y="50" width="30" height="11" rx="5.5" fill="#ffffff" opacity="0.85"/>
    <rect x="41" y="69" width="16" height="11" rx="5.5" fill="#ffffff" opacity="0.62"/>
  </g>

  <!-- Logotipo -->
  <text x="168" y="78"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" letter-spacing="-1" fill="#f8fafc">decisor</text>
  <text x="170" y="110"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" fill="#94a3b8">decisiones con probabilidad, no con prosa</text>
</svg>
