name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Formato, vet y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Ficheros sin gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Los JSON de examples/ se escriben a mano, y es facil que un ejemplo se
      # quede mal formado o traga un caracter corrupto sin que se note.
      - name: Validar ejemplos
        run: python3 scripts/validar_ejemplos.py

      # Los tests de integración se saltan solos sin SYSTEMONE_E2E, así que
      # aquí no hace falta ningún servidor de Ollama.
      - name: go test
        run: go test -race -cover ./...

      - name: Compilar
        run: go build -o decisor ./cmd/decisor
